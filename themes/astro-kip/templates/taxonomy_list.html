{% extends "base.html" %}


{% block content %}
<h1 class="page-title">Tags</h1>
<ul class="tag-index">
  {%- for term in terms %}
  <li>
    <a class="badge badge-outline" href="{{ term.permalink }}">{{ term.name }}</a>
    <span class="tag-count">{{ term.page_count }} {% if term.page_count == 1 %}post{% else %}posts{% endif %}</span>
  </li>
  {%- endfor %}
</ul>
{% endblock content %}
