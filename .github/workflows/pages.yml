# Builds the site with the pinned Zola, runs scripts/check.sh, and publishes
# public/ to GitHub Pages (https://blog.dennis.io). A failing check stops the
# deploy, so the previously published site stays live.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, publish to Pages; nothing else (no pushing to the repo).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running deploy finishes; of the runs waiting behind
# it only the newest is kept, so the last deploy is always the newest push.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Upgrade both together, and the pin in README.md.
  ZOLA_VERSION: 0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/$archive"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" zola
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Show Zola version
        run: zola --version

      # scripts/check.sh validates the Atom feed with xmllint.
      - name: Install xmllint
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libxml2-utils
          fi
          xmllint --version 2>&1 | head -n 1

      # Builds the site into public/ and asserts on the output.
      - name: Build and check
        run: scripts/check.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
